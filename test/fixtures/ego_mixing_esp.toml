# TARGETS: deterministic weighted means of per-ego contributions, scaled
# to 205; 1e-9 is agreement to the floor of two summation orders.
targets = 1e-9
# DESIGN COVARIANCE of the weighted targets: 1e-9 RELATIVE TO ITS LARGEST
# ENTRY, i.e. max|S_J - S_R| <= design_cov_rel * max|S_R|.
design_cov_rel = 1e-9
#
# FITS: the rules of ego_terms.toml, from R's own seed spread.
# COEFFICIENTS: |mean_J - mean_R| <= seed_mean_sds * sd_R * sqrt(1/n_R + 1/n_J)
#   + seed_mean_sds * sd_R * n_failed / (n_fits + n_failed),
# with the premise that one Julia fit is no noisier than one R fit
# ASSERTED by the test (its seeds differ pairwise by at most
# seed_mean_sds * sqrt(2) * sd_R). A coefficient fixed at -Inf/+Inf is
# compared exactly.
seed_mean_sds = 4.0
# STANDARD ERRORS: the Julia design component (sqrt(diag(vcov_design)),
# se=:design) is held to R's design component (*_se_model_*) by the same
# band on its sd.

