ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261002
script = "test/fixtures/r/ego_netsize.R"
date = "2026-10-02"
dataset = "a frozen 100-vertex Bernoulli(0.04) network (edge list below) and ergm::faux.mesa.high"
model = "ergm.ego fits with offset(netsize.adj(edges = 1, transitiveties = -1/3)): edges + triangle under popsize = ppopsize, 2 x ppopsize and the default 1; edges + nodematch(Grade) + gwdegree(0.5, fixed = TRUE) on the weighted sub-design; per-capita edges + nodematch(Grade) at two pseudo-population sizes; popsize = 2050 with ppopsize = 500"
replication_seeds = "101,202,303,404,505,606"

[tolerance]
# DETERMINISTIC counts on fixed networks (integers and thirds).
offset_statistic = 1e-9
#
# FITTED COEFFICIENTS -- MONTE-CARLO ON BOTH SIDES. The Julia side compares
# the mean of three seeded fits with R's mean over the `rep_seeds` that
# fitted (*_n_fits; a seed on which ergm stopped with an error is counted in
# *_n_failed), at
#   seed_mean_sds * sqrt(sd_R^2/n_fits + sd_J^2/3)  (sd_J = sd_R: both packages
#   are moment-matching by MCMC from the same targets; measured Julia
#   seed sds are of R's size or smaller),
# floored at coef_floor_se standard errors: the two packages build
# different pseudo-population networks and estimate E[g] by different
# chains, which leaves an O(1/ESS) difference that R's seed spread (as low
# as 0.003 here) does not measure. 0.15 SE is the same floor ERGM.jl's
# MCMLE fixture argues for (0.1 SE there; the ego sandwich SE is itself
# Monte-Carlo, with a seed sd of about 10 %).
# The triangle model's three fits differ from one another by 0.6 to 4.2 in
# the triangle coefficient, 30 to 200 times this tolerance.
seed_mean_sds = 4.0
coef_floor_se = 0.15
#
# STANDARD ERRORS: each package sandwiches the same design covariance with
# its own Monte-Carlo estimate of the information; the three-seed Julia
# mean is held to R's six-seed mean within this relative tolerance (R's own
# seed-to-seed sd of an SE is 5-12 % here; see the *_se_sd rows).
std_errors_rel = 0.25

