# TARGETS: deterministic weighted means of per-ego contributions, scaled
# to 205; 1e-9 is agreement to the floor of two summation orders.
targets = 1e-9
# DESIGN COVARIANCE of the weighted targets: 1e-9 RELATIVE TO ITS LARGEST
# ENTRY (the nodecov variance, ~7e4; the smallest entries are ~1e-2), i.e.
# max|S_J - S_R| <= design_cov_rel * max|S_R|.
design_cov_rel = 1e-9
#
# EVERYTHING FITTED IS MONTE-CARLO ON BOTH SIDES, and every band below is
# built from R's own seed-to-seed spread, recorded per coefficient in each
# block (n_R = *_n_fits seeds; n_J = the Julia seeds of the test):
#
# COEFFICIENTS: |mean_J - mean_R| <= seed_mean_sds * sd_R * sqrt(1/n_R + 1/n_J)
#   + seed_mean_sds * sd_R * n_failed / (n_fits + n_failed).
# The first term is the sd of the difference of two seed means when one
# Julia fit is no noisier than one R fit; the test ASSERTS that premise
# (its seeds differ pairwise by at most seed_mean_sds * sqrt(2) * sd_R).
# The second term is what a seed that failed or timed out can have moved
# R's mean, had its estimate lain anywhere inside R's seed_mean_sds band:
# the failed seeds are counted, never treated as if they had not been run.
# A coefficient fixed at -Inf/+Inf is compared exactly.
seed_mean_sds = 4.0
#
# STANDARD ERRORS: ergm.ego's standard error is the design component
# (vcov(fit, sources = "model"), *_se_model_*) plus its MCMC-estimation
# component. ERGMEgo's se=:design has the same design component and a
# smaller estimation component (a longer final sample), so its standard
# error lies between R's design component and R's total. Held to that
# interval, widened at each end by the seed-mean band above applied to
# *_se_model_sd and *_se_sd respectively; the Julia design component
# (sqrt(diag(vcov_design))) is held to R's design component by the same
# band.

