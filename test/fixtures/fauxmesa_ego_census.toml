name = "fauxmesa_ego_census"

[provenance]
r_version = "4.6.1"
ergm_ego_version = "1.1.4"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20260713
script = "test/fixtures/r/fauxmesa_ego_census.R"
date = "2026-09-12"
dataset = "ergm::faux.mesa.high: 205 students, 203 undirected friendship ties, Grade 7-12"
sampling_design = "CENSUS: as.egor(faux.mesa.high) -- every actor is an ego, unit sampling weights, ppopsize = popsize = 205. A stated, known design, chosen so the target statistics and their design variance are both DETERMINISTIC and can be asserted exactly (issue ERGMEgo#1)."
model = "egor ~ edges + nodematch(\"Grade\"), fitted by ergm.ego with an offset netsize.adj term"
replication_seeds = "101,202,303,404,505"

[tolerance]
# TARGET STATISTICS. Under a census these are the observed network's own
# statistics (edges = 203, nodematch.Grade = 163): a deterministic function
# of the data, with no sampling and no Monte Carlo. Machine precision. A
# failure here means the design-weighted per-capita scaling is wrong.
targets = 1e-9
#
# DESIGN STANDARD ERRORS OF THE TARGETS -- THE POINT OF THIS FIXTURE, AND
# THE DIRECT TEST OF ISSUE ERGMEgo#1.
#
# This is `sqrt(diag(Sigma_design))`, the survey variance of the target
# statistics: a function of the 205 per-ego contributions and their weights
# and NOTHING else -- no estimator, no MCMC, no I^-1 sandwich to blame a
# disagreement on. ERGMEgo.jl's `_design_cov` is compared to it directly,
# and to the full covariance matrix `design_cov` (off-diagonal included).
#
# HISTORY (issue ERGMEgo#1, answered by this fixture and FIXED): the first
# run of this fixture found ERGMEgo.jl's design variance too small by
# exactly the factor (n-1)/n -- `_design_cov` divided the sum of squared
# deviations by n where the survey (SRS / Horvitz-Thompson) variance of a
# mean, which ergm.ego computes, divides by n-1. The Bessel factor is now
# applied, and the Julia testset pins it with an independent Bessel
# reference (Statistics.cov) and a hand-computed weighted case, so the
# correction cannot be removed silently.
#
# The design standard errors are therefore asserted EXACTLY: 1e-9 on
# numbers of size 15.2 and 13.6 is agreement to 11 significant digits, the
# floating-point floor of two different summation orders. There is no gap
# to admit and no tolerance to justify.
design_std_errors = 1e-9
#
# DESIGN STANDARD ERRORS OF THE COEFFICIENTS WITH THE EXACT INFORMATION.
#
# `design_se_exact = sqrt(diag(I^-1 Sigma_design I^-1))` with I the exact
# Fisher information of the plain (non-egocentric) ERGM of the same model
# on the same network -- dyad-independent, so MPLE = MLE and
# `vcov(ergm(...))` is I^-1 with no MCMC in it. Both factors are
# deterministic. ERGM.jl's MPLE reproduces R's vcov to ~1e-6 (the Newton
# convergence tolerance of two different optimisers), and the Julia
# testset rebuilds the sandwich from `inv(vcov(fit_ergm(...)))` and its own
# `_design_cov`; 1e-6 on numbers of size 0.16 is what those two
# optimisers leave.
design_se_exact = 1e-6
plain_ergm_vcov = 1e-6
plain_ergm_mple = 1e-6
#
# FITTED COEFFICIENTS -- AND A PARAMETERIZATION DIFFERENCE THAT MUST BE
# MAPPED, NOT ASSUMED AWAY.
#
# ergm.ego splits the population edges parameter into a FIXED OFFSET
# `netsize.adj` = -log(popsize) = -5.3230 plus a free `edges` coefficient
# (-0.6974). ERGMEgo.jl reports a single edges coefficient on the
# pseudo-population scale, with its own adjustment -log(N/m), which under
# this census (N = m = 205) is 0. The two numbers are therefore NOT
# comparable term-by-term: R's -0.6974 and Julia's -6.03 are the same
# parameter in different parameterizations. The quantity both packages
# estimate is netsize.adj + edges = -6.0204, frozen below as
# `mle_coefficients_population`, and it is what the Julia testset compares
# against. (Cross-check: a plain ERGM.jl MPLE of edges + nodematch on the
# same 205-node network gives -6.034 / 2.831 -- which is what a census
# SHOULD reduce to, and it does.)
#
# Both sides are moment-matching by MCMC. Measured spreads (ERGMEgo.jl
# under its 2026-09 defaults: ERGM.jl's t-ratio + Hotelling convergence
# rule, dyad-scaled burnin 20*n_dyads / interval n_dyads/10, 3000 draws,
# effective sample size 120-180 per draw):
#   ergm.ego seed-to-seed sd : 0.0100 (edges), 0.0098 (nodematch)
#   ERGMEgo.jl seed-to-seed sd: 0.026, 0.026 (was 0.040/0.044 under the
#                               pre-panel 1 % relative-change rule;
#                               0.012/0.012 over six seeds since round 2
#                               made the passing sample the final one)
#   |mean(ERGMEgo.jl, 5 seeds) - R| : 0.010, 0.012 (was 0.052/0.047)
# The combined Monte-Carlo sd of the two means is
# sqrt(0.026^2/5 + 0.010^2) = 0.015, so the observed gap is 0.7-0.8 of it:
# no systematic difference is detectable any more (the earlier 0.052 gap
# was the relative-change rule stopping at the noise level, not the
# pseudo-population construction).
#
# 0.05 is >= 3x the combined Monte-Carlo sd of the two means (0.046) and
# >= 2x the larger observed gap (0.024); it is 0.28 of the smaller fitted
# standard error. Both sides are seeded, so the comparison is
# deterministic and cannot flake.
mle_coefficients_population = 0.05
#
# STANDARD ERRORS OF THE COEFFICIENTS -- MONTE-CARLO ON BOTH SIDES.
#
# `mle_std_errors` and `mle_se_design_component` sandwich the (exact)
# design covariance with an MCMC ESTIMATE of the information, on both
# sides: ergm.ego's DtDe (frozen as `r_DtDe`) and ERGMEgo.jl's covariance
# of its final sample. Neither is the exact information: R's DtDe puts
# solve(DtDe)[1,1] = 0.02853 against the exact I^-1[1,1] = 0.02506 (12 %
# high), so R's design SE (0.1779 / 0.1954) sits 0.022 / 0.019 above the
# exact `design_se_exact` (0.1563 / 0.1760); ERGMEgo.jl's per-fit design SE
# has mean 0.160 / 0.177 and seed-to-seed sd 0.013 / 0.009 over the five
# replication seeds, i.e. it scatters around the exact value with R's DtDe
# 1.4 sd above it. The largest per-fit |Julia - R| observed is 0.039.
#
# 0.06 = R's 0.022 offset from the exact value + 3 x ERGMEgo.jl's 0.013
# per-fit sd. It is applied per fit (every one of the five seeds must
# pass), and separately the five-seed MEAN SE is held to it as well. The
# estimation component is NOT held to a tolerance: it is I^-1/n_eff and
# n_eff is a property of each package's own chain (ERGMEgo.jl's is
# ~150 per 3000-draw sample; ergm.ego's larger sample gives 0.0083 /
# 0.0103); the testset asserts it is below 0.3 x the design component.
mle_std_errors = 0.06
mle_se_design_component = 0.06

