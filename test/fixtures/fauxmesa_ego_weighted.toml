name = "fauxmesa_ego_weighted"

[provenance]
r_version = "4.6.1"
ergm_ego_version = "1.1.4"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20260912
script = "test/fixtures/r/fauxmesa_ego_weighted.R"
date = "2026-09-12"
dataset = "ergm::faux.mesa.high: 205 students, 203 undirected friendship ties, Grade 7-12"
sampling_design = "WEIGHTED SUBSAMPLE: egos 1, 4, 7, ..., 205 (every third actor, 69 egos) of as.egor(faux.mesa.high), case weights Grade - 6 (1 to 6), ppopsize = popsize = 205 (netsize.adj = 0). Deterministic ego set, unequal weights: the Hajek targets, the design variance of a weighted mean and the weight-proportional pseudo-population all enter, which the census fixture cannot exercise."
model = "egor ~ edges + nodematch(\"Grade\") fitted by ergm.ego (popsize = 205, control.ergm.ego(ppopsize = 205)); targets and design covariance frozen for edges + nodematch(\"Grade\") + gwdegree(0.5, fixed = TRUE) + triangle"
replication_seeds = "101,202,303,404,505"

[tolerance]
# WEIGHTED TARGETS (edges, nodematch.Grade, gwdeg.fixed.0.5, triangle,
# scaled to 205). Hajek estimates: 205 * sum(w_i h_i) / sum(w_i) with the
# per-ego contributions degree/2, matches/2, e^a(1-(1-e^-a)^degree) and
# alter-alter ties/3. Deterministic; 1e-9 on numbers of size 56-210 is
# agreement to 11 significant digits, the floor of two summation orders.
targets = 1e-9
#
# DESIGN STANDARD ERRORS OF THE TARGETS, sqrt(diag(Sigma_design)), and the
# full 4x4 Sigma_design (off-diagonal included): the with-replacement
# variance of a WEIGHTED mean, m^2 n/(n-1) sum_i w_i^2 (h_i - hbar)(h_i - hbar)'
# with normalised weights -- the survey variance ergm.ego computes for a
# design with unequal case weights. Deterministic; asserted exactly.
design_std_errors = 1e-9
#
# THE PSEUDO-POPULATION'S COMPOSITION BY GRADE (ppop_grade_counts): egos
# replicated in proportion to their weights, 205 vertices in all.
# ergm.ego's ppop.wt = "round" and ERGMEgo.jl's largest-remainder rounding
# give the same counts here; asserted exactly (integers).
ppop_grade_counts = 0.5
#
# EXACT INFORMATION at ergm.ego's estimate on that pseudo-population and
# the design SE it implies (design_se_exact): a closed-form dyad sum with
# no estimator in it, reproducible in Julia from the frozen counts and
# coefficients to machine precision.
exact_information = 1e-6
design_se_exact = 1e-9
#
# FITTED POPULATION-SCALE COEFFICIENTS -- MONTE-CARLO ON BOTH SIDES.
# Both packages are moment-matching by MCMC from the same targets. Measured
# spreads on this design:
#   ergm.ego seed-to-seed sd (5 seeds)   : 0.0070 (edges), 0.0084 (nodematch)
#   ERGMEgo.jl seed-to-seed sd (10 seeds): 0.0093, 0.0103
#   ergm.ego 5-seed mean                 : -5.6035, 2.2894
#   ERGMEgo.jl 10-seed mean              : -5.6032, 2.2906
# The two means differ by 0.0003 / 0.001 -- well inside the combined
# Monte-Carlo sd of the two means (sqrt(0.0070^2/5 + 0.0093^2/10) = 0.004):
# no systematic difference is detectable. A SINGLE Julia fit is held to the
# single frozen R fit at 0.05: the combined single-fit sd is
# sqrt(0.0070^2 + 0.0093^2) = 0.012, so 0.05 is 4x it (and 0.2 of the
# smaller fitted standard error; the largest single-fit gap seen over ten
# Julia seeds was 0.026). The 3-seed Julia mean is held to ergm.ego's 5-seed
# mean at 0.03 (5x the combined sd of the two means, 0.006). Both sides are
# seeded: deterministic, cannot flake.
mle_coefficients_population = 0.05
mcmle_seed_mean = 0.03
#
# STANDARD ERRORS -- MONTE-CARLO ON BOTH SIDES. Each package sandwiches the
# (exact) design covariance with ITS OWN MCMC estimate of the information.
# R's DtDe puts the design SE at 0.2366 / 0.2510 against the exact 0.2349 / 0.2548
# (ergm.ego 5-seed SE mean 0.2378 / 0.2658, sd 0.0209 / 0.0213); ERGMEgo.jl's
# per-fit SE has mean 0.243 / 0.262 and sd 0.024 / 0.022 over 10 seeds, i.e.
# both scatter around the exact value (the census fixture's 12 % offset of
# R's DtDe does not recur here). The information is the covariance of the
# ONE sample that passed the convergence tests (n_eff ~ 110-170), so the
# Julia per-fit SE carries that sample's noise: the largest |Julia - exact|
# over ten seeds was 0.050 / 0.042 and the largest |Julia - R| 0.048 / 0.038.
# 0.08 is > 3x the Julia per-fit sd (0.072) and R's offset from the exact
# value + 3x that sd, rounded up; it is 0.3 of the standard error. Applied
# per fit (three seeds) to the design component and to the total; the
# estimation component is not held to a tolerance (I^-1/n_eff is a
# property of each package's own chain) beyond being < 0.3x the design part.
mle_std_errors = 0.08
mle_se_design_component = 0.08

